spring.application.name=DeliveryApplication

server.port=8080

# ==================== H2 DATABASE ====================
spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Acessar: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==================== JPA/HIBERNATE ====================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true

# ==================== SWAGGER/OPENAPI ====================
# Desabilita temporariamente para evitar conflitos
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configurações para evitar erro 500
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Ignora campos problemáticos
springdoc.model-and-view-allowed=true

# ==================== LOGGING ====================
logging.level.root=INFO
logging.level.com.pedroferreira.deliveryapplication=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springdoc=DEBUG

# ==================== JACKSON ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false

# ==================== VALIDATION ====================
spring.jackson.deserialization.fail-on-unknown-properties=false