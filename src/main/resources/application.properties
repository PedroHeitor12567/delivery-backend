# ==================== APPLICATION INFO ====================
spring.application.name=DeliveryApplication
server.port=8080

# ==================== PROFILES ====================
spring.profiles.active=dev

# ==================== POSTGRESQL DATABASE ====================
# URL de conexão (porta 5433 conforme seu ambiente)
spring.datasource.url=jdbc:postgresql://localhost:5433/deliverydb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialect específico do PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==================== JPA/HIBERNATE ====================
# DDL: validate (prod), update (dev), create-drop (test)
spring.jpa.hibernate.ddl-auto=update

# SQL Logging (desabilitar em produção)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Configurações de Performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Geração de estatísticas (útil para debug)
spring.jpa.properties.hibernate.generate_statistics=false

# Configuração de schema (opcional)
# spring.jpa.properties.hibernate.default_schema=public

# Inicialização de dados
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==================== HIKARICP (CONNECTION POOL) ====================
# Configurações otimizadas para PostgreSQL
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# Nome do pool
spring.datasource.hikari.pool-name=DeliveryHikariPool

# Propriedades PostgreSQL específicas
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

# ==================== SWAGGER/OPENAPI ====================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configurações de mídia
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Configurações adicionais
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.model-and-view-allowed=true

# Informações da API
springdoc.api-docs.groups.enabled=true
springdoc.swagger-ui.display-request-duration=true

# ==================== JACKSON (JSON) ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.locale=pt_BR
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Formatação de datas
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-dates-with-zone-id=true

# ==================== SPRING SECURITY ====================
# Configurações básicas (ajuste conforme necessidade)
spring.security.user.name=admin
spring.security.user.password=admin123

# ==================== JWT CONFIGURATION ====================
# Chave secreta (DEVE SER ALTERADA EM PRODUÇÃO!)
# Gere uma nova: openssl rand -base64 32
jwt.secret=YXBsaWNhY2FvZGVsaXZlcnlzZWNyZXRrZXkyMDI0c3ByaW5nYm9vdGp3dHRva2Vu
jwt.expiration=86400000
# 86400000 ms = 24 horas
# 3600000 ms = 1 hora
# 1800000 ms = 30 minutos

# ==================== LOGGING ====================
# Níveis de log
logging.level.root=INFO
logging.level.com.pedroferreira.deliveryapplication=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springdoc=DEBUG

# Logs SQL detalhados (comentar em produção)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# HikariCP logging
logging.level.com.zaxxer.hikari=INFO

# PostgreSQL driver logging
logging.level.org.postgresql=INFO

# Formato de log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Arquivo de log (opcional)
# logging.file.name=logs/delivery-app.log
# logging.file.max-size=10MB
# logging.file.max-history=30

# ==================== ACTUATOR (OPCIONAL) ====================
# Descomente se usar spring-boot-starter-actuator
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=when-authorized
# management.metrics.enable.jvm=true

# ==================== PERFORMANCE & TUNING ====================
# Server configurations
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# Tomcat specific
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# ==================== TIMEZONE ====================
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ==================== ERROR HANDLING ====================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ==================== OUTRAS CONFIGURAÇÕES ====================
# Desabilita banner do Spring (opcional)
# spring.main.banner-mode=off

# Permite sobrescrever beans
spring.main.allow-bean-definition-overriding=false

# Circular references
spring.main.allow-circular-references=false