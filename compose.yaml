version: "3.9"

services:
  api:
    image: springboot-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://ep-wild-band-ap2h5dyb-pooler.c-7.us-east-1.aws.neon.tech:5432/neondb
      DB_USER: neondb_owner
      DB_PASSWORD: npg_9N3LvDGwVOMs
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: neondb
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_9N3LvDGwVOMs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - delivery-network

volumes:
  postgres_data:

networks:
  delivery-network:
    driver: bridge
